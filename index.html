<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <script>
      // set the theme before first paint so there is no flash
      (function () {
        try {
          var t = localStorage.getItem('my-everyday-routine:theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;

          // A full-screen panel that was open before the refresh takes a moment to
          // come back: the app has to boot, fetch the page it lives on and read
          // its data first. Without this you watch the page behind it assemble,
          // which reads as the refresh hanging. Lay the panel's own background
          // down now, at once, and let the real thing replace it underneath.
          if (localStorage.getItem('my-everyday-routine:fullscreen')) {
            var cover = document.createElement('div');
            cover.id = 'fs-boot';
            cover.style.cssText = 'position:fixed;inset:0;z-index:250;background:'
              + (t === 'light' ? '#F7F3EA' : '#05060D');
            document.documentElement.appendChild(cover);
            // never leave someone staring at a blank screen if it does not arrive
            setTimeout(function () { cover.remove(); }, 4000);
          }
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#05060D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F3EA" media="(prefers-color-scheme: light)" />
    <title>My Growth Tracker</title>

    <!-- Installable on a phone home screen. iOS ignores the manifest's display
         mode, so the apple-* tags are what actually make it open fullscreen. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Routine" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded as print, then claimed for the screen once it arrives. A plain
         stylesheet here blocks rendering AND every classic script after it, so a
         slow reply from Google was holding up the whole page. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    </noscript>
    <script type="module" crossorigin src="./assets/index-CBq9_j8c.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CvCihyhi.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
