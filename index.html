<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />

    <script>
      // set the theme before first paint so there is no flash
      (function () {
        try {
          var t = localStorage.getItem('my-everyday-routine:theme');
          if (t !== 'light' && t !== 'dark' && t !== 'paper') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = t;
          // e-ink is a light scheme as far as the browser's own furniture goes
          document.documentElement.style.colorScheme = t === 'dark' ? 'dark' : 'light';

          // A full-screen panel that was open before the refresh takes a moment to
          // come back: the app has to boot, fetch the page it lives on and read
          // its data first. Without this you watch the page behind it assemble,
          // which reads as the refresh hanging. Lay the panel's own background
          // down now, at once, and let the real thing replace it underneath.
          if (localStorage.getItem('my-everyday-routine:fullscreen')) {
            var cover = document.createElement('div');
            cover.id = 'fs-boot';
            cover.style.cssText = 'position:fixed;inset:0;z-index:250;background:'
              + (t === 'dark' ? '#05060D' : t === 'paper' ? '#F6F4EF' : '#F7F3EA');
            document.documentElement.appendChild(cover);
            // never leave someone staring at a blank screen if it does not arrive
            setTimeout(function () { cover.remove(); }, 4000);
          }
        } catch (e) {}
      })();

      // Safari has ignored user-scalable=no since iOS 10, so the meta tag above
      // is only half of it. A pinch is a gesture event on iOS and a two-finger
      // touchmove everywhere else; ctrl with the wheel is how a trackpad pinch
      // arrives on a desktop. Refusing those three is what actually holds the
      // app at one size — double tap is left to touch-action in the stylesheet,
      // which is the only thing browsers still honour for it. One-finger
      // scrolling is untouched.
      (function () {
        var stop = function (e) { e.preventDefault(); };
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (name) {
          document.addEventListener(name, stop, { passive: false });
        });
        document.addEventListener('touchmove', function (e) {
          if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
        window.addEventListener('wheel', function (e) {
          if (e.ctrlKey) e.preventDefault();
        }, { passive: false });
      })();
    </script>
    <meta name="theme-color" content="#05060D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F3EA" media="(prefers-color-scheme: light)" />
    <title>My Growth Tracker</title>

    <!-- Installable on a phone home screen. iOS ignores the manifest's display
         mode, so the apple-* tags are what actually make it open fullscreen. -->
    <link rel="manifest" href="./manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded as print, then claimed for the screen once it arrives. A plain
         stylesheet here blocks rendering AND every classic script after it, so a
         slow reply from Google was holding up the whole page. -->
    <link
